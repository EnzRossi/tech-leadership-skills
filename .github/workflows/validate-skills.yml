name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt
      - name: Specification and repository conventions (not model evals)
        run: python scripts/validate_skills.py --require-reference
      - name: Validator regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
